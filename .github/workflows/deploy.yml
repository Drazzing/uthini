# Publish uthini.com — see README for CLOUDFLARE_API_TOKEN permissions.

name: Publish site

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: publish-site
  cancel-in-progress: true

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  PAGES_PROJECT: uthini
  WORKER_NAME: uthini-contact-email

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Preflight
        run: bash scripts/cloudflare-preflight.sh

      - name: Build
        run: bash scripts/prepare-deploy.sh

      - name: Deploy
        run: |
          npx wrangler@4 deploy --config workers/contact-email/wrangler.toml
          npx wrangler@4 pages deploy dist --project-name="$PAGES_PROJECT" --branch=main
